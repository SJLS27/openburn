name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Reused by release.yml so a tag can only publish when CI is green on the
  # same commit: `commit` is forwarded to every checkout.
  workflow_call:
    inputs:
      commit:
        description: Commit to test (defaults to the triggering ref)
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run check:flatpak-sources
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Unlike typecheck/build, the e2e job needs the Electron binary.
      - run: npm ci
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a npm run test:e2e
